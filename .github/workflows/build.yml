---
name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        # Sem `version`: o action le o campo packageManager do package.json.
        # Fixar `version: 8` fazia o runner usar pnpm 8, que nao le o lockfile
        # gerado pelo pnpm 10 — ele ignorava o lockfile e re-resolvia tudo,
        # instalando versoes diferentes das fixadas a cada execucao.
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STORE_PATH }}
            ${{ github.workspace }}/.next/cache
          # A chave depende SO do lockfile: o que esta em cache e o store do
          # pnpm, que muda quando as dependencias mudam — nao quando o codigo
          # muda. Hashear os fontes fazia duas coisas ruins: (1) a chave mudava
          # a cada edicao, entao o cache nunca era reaproveitado; e (2) o
          # hashFiles varria todo .js/.ts/.tsx do repo, node_modules incluso, e
          # estourava o limite de 120s do runner — quebrando o post-step que
          # salva o cache e marcando como falha um job que passou inteiro.
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        env:
          # Suite cresceu (~150+ tests adicionados em features recentes);
          # heap default de 4GB do Node nao basta no runner ubuntu-latest
          # (7GB RAM). Subir para 6GB previne JS heap OOM no jest.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build
