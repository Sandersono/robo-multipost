rules:
  - id: dangerously-set-inner-html-unsanitized
    languages: [typescript]
    severity: WARNING
    message: >
      dangerouslySetInnerHTML com conteúdo possivelmente não sanitizado. Conteúdo que pode vir de
      outro usuário, da saída da IA, ou de comentários do IG (via webhook) deve passar por
      sanitizePostContent (DOMPurify) antes de ir para __html. Regex/replaceLinks NÃO sanitizam.
      Ver SECURITY_AUDIT.md achados C2, C3, C4.
    metadata:
      cwe: "CWE-79: Cross-site Scripting (XSS)"
      audit-finding: C2,C3,C4
    patterns:
      # Duas armadilhas ja pagas aqui:
      # 1. o atributo precisa vir DENTRO de um elemento JSX — atributo solto
      #    nao e expressao valida e o semgrep recusa a regra (PatternParseError);
      # 2. tem que ser escalar de BLOCO (|), porque "__html: $HTML" tem
      #    dois-pontos-espaco e quebraria o YAML se fosse inline.
      - pattern: |
          <$EL dangerouslySetInnerHTML={{ __html: $HTML }} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: sanitizePostContent(...) }} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: sanitizeChatContent(...) }} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} />
    paths:
      include:
        - "apps/frontend/**"
